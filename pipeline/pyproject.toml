[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlagg"
version = "0.1.0"
description = "Newsletter aggregator pipeline: capture -> clean/split -> enrich -> cluster -> compose"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Gmail REST API backend (reuses the google-skill OAuth token; no re-auth needed)
gmail = [
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
]
dev = ["pytest>=7"]

[project.scripts]
nlagg = "nlagg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nlagg = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
