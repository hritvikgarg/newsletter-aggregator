# Pipeline configuration. Paths are relative to the REPO ROOT.
# Secrets never go here — use environment variables (see .env.example).

paths:
  archive_dir: data/archive          # .eml/.md files (gitignored)
  db_path: data/archive/index.db     # SQLite index (gitignored)
  category_feeds: data/category_feeds.csv
  sources: data/sources.csv

inbox:
  address: notifyy1008@gmail.com
  # Gmail search used by the API backend. Sent/drafts/chats never contain newsletters.
  query: "in:anywhere -in:sent -in:drafts -in:chats"
  # Incremental runs re-scan this many days before the last successful sync
  # (cheap: already-captured ids are skipped), so late-arriving mail is never missed.
  overlap_days: 3
  # Senders that are never newsletters (our own test mails, Google account notices).
  ignore_senders:
    - notifyy1008@gmail.com
    - noreply-accounts@google.com
    - no-reply@accounts.google.com

# Segment routing.
# 1) sender_overrides are checked FIRST (exact substring match on the sender address).
#    Needed for sites that rejected '+' addresses, and for Lawfare (arrives on +techai, belongs in Legal).
# 2) Otherwise the '+tag' on Delivered-To/To is mapped using data/category_feeds.csv.
# 3) Otherwise the message is 'unmatched'.
segments:
  sender_overrides:
    - match: hrbrew@morningbrew.com
      segment: 4-HRPeopleOps
    - match: morningbrew.com
      segment: 2-BizFinance
    - match: findlaw.com
      segment: 3-Legal
    - match: babylonbee.com
      segment: 7-Absurdist
    - match: lawfare
      segment: 3-Legal
    # Tech/AI picks that arrived on +legal via Substack recommendations (seen in the first real capture)
    - match: pragmaticengineer
      segment: 1-TechAI
    - match: importai
      segment: 1-TechAI
  # 3) sender_fallbacks apply ONLY when no +tag matched (mail sent to the plain address).
  #    Matched as a substring of "display name <address>", lowercased. First match wins.
  #    From the first real capture (2026-10-04): these picks also arrive at the plain address.
  #    Newsletters we did NOT pick (Bloomberg, Axios Markets, Snacks, ...) stay 'unmatched' on purpose.
  sender_fallbacks:
    - match: tldrnewsletter.com
      segment: 1-TechAI
    - match: trends.vc
      segment: 6-IndieHacker
    - match: natlawreview.com
      segment: 3-Legal
    - match: "hr brew <"              # HR Brew sent via mail.sailthru.com
      segment: 4-HRPeopleOps
    - match: morningbrew@mail.sailthru.com
      segment: 2-BizFinance
  # Which segments the downstream stages (split/enrich/compose) run on. Capture always takes everything.
  active: [1-TechAI]

# Phase 5 LLM (used from M3 onward). Never Claude — team rule.
llm:
  provider: groq                      # groq | ollama | any OpenAI-compatible endpoint
  base_url: https://api.groq.com/openai/v1
  extract_model: llama-3.1-8b-instant # cheap per-item extraction
  write_model: llama-3.3-70b-versatile
  api_key_env: GROQ_API_KEY
  max_retries: 3
  prompt_version: v1

# M5: our issue. Names are placeholders — change freely.
compose:
  title:
    1-TechAI: "Tech & AI, Distilled"
  labels:
    1-TechAI: "tech and AI"

# M6: delivery after `nlagg approve`. Sent from NLAGG_IMAP_USER with the same App Password (SMTP).
# Empty recipients = approve only writes/keeps the HTML file, nothing is emailed.
delivery:
  recipients: []          # e.g. ["you@example.com", "teammate@example.com"]
  owner: ""               # gets "draft ready" + source-health alerts from the daily run (optional)
  smtp_host: smtp.gmail.com
  smtp_port: 465

# M7: daily run (Windows Task Scheduler, see pipeline/scripts/install_daily_task.ps1)
daily:
  capture_backend: imap
  extract_days: 2
  cluster_hours: 48
  health_quiet_days: 4    # alert when a picked newsletter has sent nothing for this many days
