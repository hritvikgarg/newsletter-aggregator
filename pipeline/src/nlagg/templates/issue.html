<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$subject</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  body { -webkit-text-size-adjust: 100%; }
  a { color: #14121F; }
  @media (max-width: 640px) {
    .col { display: block !important; width: 100% !important; box-sizing: border-box; }
    .px { padding-left: 8px !important; padding-right: 8px !important; }
    .pad { padding-left: 20px !important; padding-right: 20px !important; }
    .h1 { font-size: 30px !important; }
    .h2 { font-size: 24px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#F5F5F8;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">$preheader</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F5F5F8;">
<tr><td align="center" style="padding:24px 10px 40px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:680px;">

  <!-- masthead -->
  <tr><td class="pad" style="padding:8px 24px 0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td style="font-family:'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:21px;font-weight:800;letter-spacing:-0.02em;color:#14121F;">
        <span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:#6E45D8;margin-right:9px;vertical-align:0;"></span>$wordmark
      </td>
      <td align="right" style="font-family:'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;color:#6B6B76;">$date_label</td>
    </tr></table>
  </td></tr>

  <!-- the day in one line -->
  <tr><td class="pad" style="padding:34px 24px 26px;font-family:'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;">
    <h1 class="h1" style="margin:0 0 14px;font-size:38px;line-height:1.1;font-weight:800;letter-spacing:-0.03em;color:#14121F;">$subject</h1>
    <p style="margin:0;font-size:18px;line-height:1.55;color:#4A4957;">$hook</p>
  </td></tr>

  <!-- today's big story -->
  <tr><td class="px" style="padding:0 16px;">$featured</td></tr>

  $talking_block
  $quick_block
  $skip_block

  <!-- sign-off -->
  <tr><td class="pad" style="padding:34px 24px 6px;font-family:'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#14121F;">
    $close
  </td></tr>
  <tr><td class="pad" style="padding:22px 24px 0;border-top:1px solid #E7E6EE;font-family:'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6B6B76;">
    $footer
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
